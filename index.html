<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Песни Светланы Дудко</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #1db954;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --hover-bg: #2a2a2a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 20px 30px;
            background-color: var(--surface-color);
            border-bottom: 1px solid #333;
        }

        h1 {
            margin: 0;
            font-size: 1.8em;
            font-weight: 700;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 20px 30px;
        }

        .song-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .song-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 5px;
        }

        .song-item:hover {
            background-color: var(--hover-bg);
        }

        .song-item.active {
            background-color: rgba(29, 185, 84, 0.15);
        }

        .song-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .song-title {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 4px;
        }

        .song-artist {
            color: var(--text-secondary);
            font-size: 0.9em;
        }

        .song-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.4em;
            padding: 5px;
            border-radius: 50%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            color: var(--text-primary);
            transform: scale(1.1);
        }

        .btn-fav.active {
            color: var(--primary-color);
        }

        .player-bar {
            background-color: var(--surface-color);
            border-top: 1px solid #333;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 90px;
        }

        .current-track-info {
            display: flex;
            align-items: center;
            width: 30%;
        }

        .current-track-details {
            display: flex;
            flex-direction: column;
            margin-left: 15px;
        }

        .current-track-title {
            font-weight: 600;
            font-size: 0.95em;
        }

        .current-track-artist {
            color: var(--text-secondary);
            font-size: 0.8em;
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40%;
        }

        .control-buttons {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 8px;
        }

        .btn-control {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2em;
            transition: color 0.2s;
        }

        .btn-control:hover {
            color: var(--text-primary);
        }

        .btn-play-pause {
            background-color: var(--text-primary);
            color: var(--bg-color);
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1em;
        }

        .btn-play-pause:hover {
            transform: scale(1.05);
            color: var(--bg-color);
        }

        .progress-container {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 10px;
        }

        .time-display {
            font-size: 0.75em;
            color: var(--text-secondary);
            min-width: 40px;
            text-align: center;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #4d4d4d;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-primary);
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .progress-container:hover input[type="range"]::-webkit-slider-thumb {
            opacity: 1;
        }

        .extra-controls {
            width: 30%;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .player-bar {
                flex-direction: column;
                height: auto;
                padding: 15px;
                gap: 15px;
            }
            .current-track-info, .player-controls, .extra-controls {
                width: 100%;
                justify-content: center;
            }
            .current-track-info {
                justify-content: flex-start;
            }
            .extra-controls {
                display: none;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎵 Песни Светланы Дудко</h1>
    </header>

    <main>
        <ul class="song-list" id="songList"></ul>
    </main>

    <div class="player-bar">
        <div class="current-track-info">
            <div class="current-track-details">
                <span class="current-track-title" id="playerTitle">Выберите трек</span>
                <span class="current-track-artist" id="playerArtist">-</span>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-buttons">
                <button class="btn-control" id="btnPrev">&#9198;</button>
                <button class="btn-control btn-play-pause" id="btnPlayPause">&#9654;</button>
                <button class="btn-control" id="btnNext">&#9197;</button>
            </div>
            
            <div class="progress-container">
                <span class="time-display" id="currentTime">0:00</span>
                <input type="range" id="progressBar" value="0" min="0" max="100" step="0.1">
                <span class="time-display" id="totalTime">0:00</span>
            </div>
        </div>

        <div class="extra-controls">
            <button class="btn-control" title="Повтор">&#128257;</button>
            <button class="btn-control" title="Случайный порядок">&#128256;</button>
            <button class="btn-control" title="Громкость">&#128266;</button>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const songs = [
            {
                title: "Ночная прогулка",
                artist: "Светлана Дудко",
                src: "nochnaya_progulka.mp3",
                isFav: false
            },
            {
                title: "Без тебя скучаю",
                artist: "Светлана Дудко",
                src: "bez_tebya_skuchayu.mp3",
                isFav: false
            },
            {
                title: "Летняя ночь",
                artist: "Светлана Дудко",
                src: "letnyaya_noch.mp3",
                isFav: false
            },
            {
                title: "Чего-то не хватает",
                artist: "Светлана Дудко",
                src: "chego_to_ne_hwataet.mp3",
                isFav: false
            }
        ];

        let currentSongIndex = -1;
        let isPlaying = false;

        const audioPlayer = document.getElementById('audioPlayer');
        const songListEl = document.getElementById('songList');
        const playerTitle = document.getElementById('playerTitle');
        const playerArtist = document.getElementById('playerArtist');
        const btnPlayPause = document.getElementById('btnPlayPause');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function renderSongList() {
            songListEl.innerHTML = '';
            songs.forEach((song, index) => {
                const li = document.createElement('li');
                li.className = `song-item ${index === currentSongIndex ? 'active' : ''}`;
                
                const playIcon = (index === currentSongIndex && isPlaying) ? '&#9208;' : '&#9654;';
                const favIcon = song.isFav ? '&#9733;' : '&#9734;';
                const favClass = song.isFav ? 'active' : '';

                li.innerHTML = `
                    <div class="song-info">
                        <span class="song-title">${song.title}</span>
                        <span class="song-artist">${song.artist}</span>
                    </div>
                    <div class="song-actions">
                        <button class="btn-icon btn-play" data-index="${index}">${playIcon}</button>
                        <button class="btn-icon btn-fav ${favClass}" data-index="${index}">${favIcon}</button>
                    </div>
                `;
                
                li.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('btn-fav')) {
                        playSong(index);
                    }
                });

                li.querySelector('.btn-play').addEventListener('click', (e) => {
                    e.stopPropagation();
                    playSong(index);
                });

                li.querySelector('.btn-fav').addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleFavorite(index);
                });

                songListEl.appendChild(li);
            });
        }

        function playSong(index) {
            if (currentSongIndex === index && isPlaying) {
                pauseSong();
                return;
            }

            currentSongIndex = index;
            const song = songs[index];
            
            audioPlayer.src = song.src;
            audioPlayer.play().catch(e => console.error("Ошибка воспроизведения:", e));
            isPlaying = true;
            
            updatePlayerUI();
            renderSongList();
        }

        function pauseSong() {
            audioPlayer.pause();
            isPlaying = false;
            updatePlayerUI();
            renderSongList();
        }

        function togglePlayPause() {
            if (currentSongIndex === -1) {
                playSong(0);
            } else if (isPlaying) {
                pauseSong();
            } else {
                audioPlayer.play().catch(e => console.error("Ошибка воспроизведения:", e));
                isPlaying = true;
                updatePlayerUI();
                renderSongList();
            }
        }

        function nextSong() {
            if (currentSongIndex === -1) return;
            let nextIndex = currentSongIndex + 1;
            if (nextIndex >= songs.length) nextIndex = 0;
            playSong(nextIndex);
        }

        function prevSong() {
            if (currentSongIndex === -1) return;
            let prevIndex = currentSongIndex - 1;
            if (prevIndex < 0) prevIndex = songs.length - 1;
            playSong(prevIndex);
        }

        function toggleFavorite(index) {
            songs[index].isFav = !songs[index].isFav;
            renderSongList();
        }

        function updatePlayerUI() {
            if (currentSongIndex !== -1) {
                const song = songs[currentSongIndex];
                playerTitle.textContent = song.title;
                playerArtist.textContent = song.artist;
                btnPlayPause.innerHTML = isPlaying ? '&#9208;' : '&#9654;';
            } else {
                playerTitle.textContent = "Выберите трек";
                playerArtist.textContent = "-";
                btnPlayPause.innerHTML = '&#9654;';
            }
        }

        function updateProgress() {
            if (audioPlayer.duration) {
                const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressBar.value = percent;
                currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
                totalTimeEl.textContent = formatTime(audioPlayer.duration);
                
                const val = (progressBar.value - progressBar.min) / (progressBar.max - progressBar.min) * 100;
                progressBar.style.background = `linear-gradient(to right, var(--primary-color) ${val}%, #4d4d4d ${val}%)`;
            }
        }

        function seek() {
            if (audioPlayer.duration) {
                const seekTime = (progressBar.value / 100) * audioPlayer.duration;
                audioPlayer.currentTime = seekTime;
            }
        }

        audioPlayer.addEventListener('loadedmetadata', updateProgress);
        audioPlayer.addEventListener('timeupdate', updateProgress);
        audioPlayer.addEventListener('ended', nextSong);

        btnPlayPause.addEventListener('click', togglePlayPause);
        btnNext.addEventListener('click', nextSong);
        btnPrev.addEventListener('click', prevSong);
        progressBar.addEventListener('input', seek);

        renderSongList();
    </script>
</body>
</html>
