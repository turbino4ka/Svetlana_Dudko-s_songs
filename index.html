<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Песни Светланы Дудко</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #1db954;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --hover-bg: #2a2a2a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 20px 30px;
            background-color: var(--surface-color);
            border-bottom: 1px solid #333;
        }

        h1 {
            margin: 0;
            font-size: 1.8em;
            font-weight: 700;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 20px 30px;
        }

        .song-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .song-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 5px;
        }

        .song-item:hover {
            background-color: var(--hover-bg);
        }

        .song-item.active {
            background-color: rgba(29, 185, 84, 0.15);
        }

        .song-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .song-title {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 4px;
        }

        .song-artist {
            color: var(--text-secondary);
            font-size: 0.9em;
        }

        .song-duration {
            color: var(--text-secondary);
            font-size: 0.95em;
            margin-right: 20px;
            min-width: 45px;
            text-align: right;
        }

        .song-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.4em;
            padding: 5px;
            border-radius: 50%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            color: var(--text-primary);
            transform: scale(1.1);
        }

        .btn-fav.active {
            color: var(--primary-color);
        }

        .player-bar {
            background-color: var(--surface-color);
            border-top: 1px solid #333;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 90px;
        }

        .current-track-info {
            display: flex;
            align-items: center;
            width: 30%;
        }

        .current-track-details {
            display: flex;
            flex-direction: column;
            margin-left: 15px;
        }

        .current-track-title {
            font-weight: 600;
            font-size: 0.95em;
        }

        .current-track-artist {
            color: var(--text-secondary);
            font-size: 0.8em;
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40%;
        }

        .control-buttons {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 8px;
        }

        .btn-control {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2em;
            transition: color 0.2s;
        }

        .btn-control:hover {
            color: var(--text-primary);
        }

        .btn-play-pause {
            background-color: var(--text-primary);
            color: var(--bg-color);
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1em;
        }

        .btn-play-pause:hover {
            transform: scale(1.05);
            color: var(--bg-color);
        }

        .progress-container {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 10px;
        }

        .time-display {
            font-size: 0.75em;
            color: var(--text-secondary);
            min-width: 40px;
            text-align: center;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #4d4d4d;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-primary);
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .progress-container:hover input[type="range"]::-webkit-slider-thumb {
            opacity: 1;
        }

        .extra-controls {
            width: 30%;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .player-bar {
                flex-direction: column;
                height: auto;
                padding: 15px;
                gap: 15px;
            }
            .current-track-info, .player-controls, .extra-controls {
                width: 100%;
                justify-content: center;
            }
            .current-track-info {
                justify-content: flex-start;
            }
            .extra-controls {
                display: none;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎵 Песни Светланы Дудко</h1>
    </header>

    <main>
        <ul class="song-list" id="songList"></ul>
    </main>

    <div class="player-bar">
        <div class="current-track-info">
            <div class="current-track-details">
                <span class="current-track-title" id="playerTitle">Выберите трек</span>
                <span class="current-track-artist" id="playerArtist">-</span>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-buttons">
                <button class="btn-control" id="btnPrev">⏮</button>
                <button class="btn-control btn-play-pause" id="btnPlayPause">▶</button>
                <button class="btn-control" id="btnNext"></button>
            </div>
            
            <div class="progress-container">
                <span class="time-display" id="currentTime">0:00</span>
                <input type="range" id="progressBar" value="0" min="0" max="100" step="0.1">
                <span class="time-display" id="totalTime">0:00</span>
            </div>
        </div>

        <div class="extra-controls">
            <button class="btn-control" title="Повтор">🔁</button>
            <button class="btn-control" title="Случайный порядок">🔀</button>
            <button class="btn-control" title="Громкость">🔊</button>
        </div>
    </div>

    <audio id="audioPlayer"></audio>
